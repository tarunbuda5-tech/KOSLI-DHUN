name: Update Sambalpuri Songs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-songs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Sambalpuri Songs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta

          API_KEY = os.environ["YOUTUBE_API_KEY"]

          queries = [
              "Sambalpuri song official",
              "Sambalpuri new song official",
              "Sambalpuri music official",
              "Sambalpuri audio song official",
              "Sambalpuri hit song official",
              "Sambalpuri old song official",
              "Sambalpuri romantic song official",
              "Sambalpuri love song official"
          ]

          blocked_words = [
              "shorts",
              "short video",
              "status video",
              "whatsapp status",
              "reels",
              "reel",
              "dance video",
              "dance shorts",
              "viral shorts",
              "shorts video",
              "status",
              "dance"
          ]

          songs = {}

          def api_request(url):
              with urllib.request.urlopen(url) as response:
                  return json.loads(response.read().decode())

          published_after = (
              datetime.now(timezone.utc) - timedelta(days=365)
          ).isoformat().replace("+00:00", "Z")

          # Search YouTube
          for query in queries:

              params = urllib.parse.urlencode({
                  "part": "snippet",
                  "q": query,
                  "type": "video",
                  "order": "date",
                  "maxResults": 50,
                  "publishedAfter": published_after,
                  "key": API_KEY
              })

              url = (
                  "https://www.googleapis.com/youtube/v3/search?"
                  + params
              )

              try:
                  data = api_request(url)
              except Exception as e:
                  print("Search error:", e)
                  continue

              for item in data.get("items", []):

                  video_id = item.get("id", {}).get("videoId")

                  if not video_id:
                      continue

                  title = item.get("snippet", {}).get("title", "")
                  channel = item.get("snippet", {}).get(
                      "channelTitle", ""
                  )
                  published = item.get("snippet", {}).get(
                      "publishedAt", ""
                  )

                  title_lower = title.lower()

                  # Remove Shorts / status / reels
                  if any(word in title_lower for word in blocked_words):
                      continue

                  # Avoid duplicates
                  if video_id in songs:
                      continue

                  thumbnail = (
                      f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"
                  )

                  songs[video_id] = {
                      "id": video_id,
                      "title": title,
                      "channel": channel,
                      "publishedAt": published,
                      "duration": 0,
                      "thumbnail": thumbnail,
                      "youtubeUrl": (
                          f"https://www.youtube.com/watch?v={video_id}"
                      )
                  }

          # Get video durations
          video_ids = list(songs.keys())

          for i in range(0, len(video_ids), 50):

              batch = video_ids[i:i + 50]

              params = urllib.parse.urlencode({
                  "part": "contentDetails",
                  "id": ",".join(batch),
                  "key": API_KEY
              })

              url = (
                  "https://www.googleapis.com/youtube/v3/videos?"
                  + params
              )

              try:
                  data = api_request(url)
              except Exception as e:
                  print("Duration error:", e)
                  continue

              for item in data.get("items", []):

                  video_id = item["id"]

                  duration = item["contentDetails"].get(
                      "duration", ""
                  )

                  # Convert ISO 8601 duration to seconds
                  import re

                  match = re.match(
                      r"PT"
                      r"(?:(\d+)H)?"
                      r"(?:(\d+)M)?"
                      r"(?:(\d+)S)?",
                      duration
                  )

                  if match:
                      hours = int(match.group(1) or 0)
                      minutes = int(match.group(2) or 0)
                      seconds = int(match.group(3) or 0)

                      total_seconds = (
                          hours * 3600
                          + minutes * 60
                          + seconds
                      )

                      if video_id in songs:
                          songs[video_id]["duration"] = total_seconds

          # Remove very short videos
          songs = {
              k: v
              for k, v in songs.items()
              if v["duration"] >= 60
          }

          # Sort newest first
          song_list = list(songs.values())

          song_list.sort(
              key=lambda x: x.get("publishedAt", ""),
              reverse=True
          )

          # Keep latest 300 songs
          song_list = song_list[:300]

          os.makedirs("data", exist_ok=True)

          with open(
              "data/songs.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  song_list,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Successfully saved {len(song_list)} songs."
          )
          PY

      - name: Check songs.json
        run: |
          echo "Songs found:"
          python - <<'PY'
          import json

          with open("data/songs.json", encoding="utf-8") as f:
              songs = json.load(f)

          print("Total songs:", len(songs))

          for song in songs[:10]:
              print("-", song["title"])
          PY

      - name: Commit Updated Songs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/songs.json

          if git diff --cached --quiet; then
            echo "No new songs found."
          else
            git commit -m "Auto update Sambalpuri songs"
            git push
          fi
